version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: revpilot-db
    environment:
      POSTGRES_USER: revpilot
      POSTGRES_PASSWORD: revpilot_secret_password
      POSTGRES_DB: revpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revpilot -d revpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: revpilot-backend
    environment:
      DATABASE_URL: postgresql://revpilot:revpilot_secret_password@db:5432/revpilot
      DEMO_MODE: "true"
      SECRET_KEY: "revpilot-production-super-secret-key-replace-in-env"
      AS_OF_DATE: "2026-10-20T00:00:00Z"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: revpilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
